<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-label="Mohammed Maaz">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2997ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2997ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#2997ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="840" height="200" rx="22" fill="#141417" stroke="#27272a" stroke-width="1"/>

  <circle cx="420" cy="100" r="150" fill="url(#glow)">
    <animate attributeName="r" values="130;175;130" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;1;0.65" dur="6s" repeatCount="indefinite"/>
  </circle>

  <rect x="120" y="1" width="600" height="1.5" fill="url(#lineGrad)">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="420" y="78" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Helvetica Neue, sans-serif" font-size="38" font-weight="600" letter-spacing="-0.03em">
    Mohammed Maaz
  </text>

  <text x="420" y="110" text-anchor="middle" fill="#8e8e93" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, Helvetica Neue, sans-serif" font-size="15" font-weight="400" letter-spacing="-0.01em">
    Computer Science · Spring Boot · React · Java DSA
  </text>

  <g transform="translate(230, 136)">
    <rect x="0" y="0" width="82" height="26" rx="13" fill="#1c1c20" stroke="#27272a" stroke-width="1"/>
    <text x="41" y="17" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, sans-serif" font-size="11.5" font-weight="500">Spring Boot</text>

    <rect x="94" y="0" width="64" height="26" rx="13" fill="#1c1c20" stroke="#27272a" stroke-width="1"/>
    <text x="126" y="17" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, sans-serif" font-size="11.5" font-weight="500">React</text>

    <rect x="170" y="0" width="58" height="26" rx="13" fill="#1c1c20" stroke="#27272a" stroke-width="1"/>
    <text x="199" y="17" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, sans-serif" font-size="11.5" font-weight="500">Java</text>

    <rect x="240" y="0" width="66" height="26" rx="13" fill="#1c1c20" stroke="#27272a" stroke-width="1"/>
    <text x="273" y="17" text-anchor="middle" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, sans-serif" font-size="11.5" font-weight="500">Python</text>

    <rect x="318" y="0" width="62" height="26" rx="13" fill="#1c1c20" stroke="#27272a" stroke-width="1"/>
    <text x="349" y="17" text-anchor="middle" fill="#2997ff" font-family="-apple-system, BlinkMacSystemFont, SF Pro Text, sans-serif" font-size="11.5" font-weight="600">Web3</text>
  </g>
</svg>